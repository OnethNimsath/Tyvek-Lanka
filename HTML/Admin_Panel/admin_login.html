<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/CSS/admin_login.css">

    <style>
        /* Custom Popup Styles */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            transform: scale(0.7);
            transition: transform 0.3s ease;
        }

        .popup-overlay.show .popup-content {
            transform: scale(1);
        }

        .popup-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #28a745, #20c997);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 24px;
        }

        .popup-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .popup-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .popup-button {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        .popup-button:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4);
        }

        .popup-button:active {
            transform: translateY(0);
        }

        /* Error popup styles */
        .popup-content.error .popup-icon {
            background: linear-gradient(135deg, #dc3545, #c82333);
        }

        .popup-content.error .popup-button {
            background: linear-gradient(135deg, #dc3545, #c82333);
        }

        .popup-content.error .popup-button:hover {
            background: linear-gradient(135deg, #c82333, #a71e2a);
        }
    </style>

    <script type="module">
        // Import the functions you need from the SDKs you want to use
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            getDoc,
            collection
        } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // Your web app's Firebase configuration (NOW WITH YOUR PROVIDED VALUES)
        const firebaseConfig = {
            apiKey: "AIzaSyAo4MUZvb-eBcl_9YbdkW3QBY64SJrNudQ",
            authDomain: "tyveklanka-a9dd1.firebaseapp.com",
            projectId: "tyveklanka-a9dd1",
            storageBucket: "tyveklanka-a9dd1.firebasestorage.app",
            messagingSenderId: "985040063470",
            appId: "1:985040063470:web:8034aba2c17aae72f45cff"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Make Firebase instances and functions globally accessible for event listeners below
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.setDoc = setDoc;
        window.doc = doc;
        window.getDoc = getDoc;
        window.collection = collection;
    </script>
</head>
<body>
    <!-- Custom Popup -->
    <div id="customPopup" class="popup-overlay">
        <div class="popup-content">
            <div class="popup-icon">
                <i class="fas fa-check"></i>
            </div>
            <div class="popup-title" id="popupTitle">Login Successful!</div>
            <div class="popup-message" id="popupMessage">Welcome back! You are being redirected...</div>
            <button class="popup-button" id="popupButton" onclick="closePopup()">OK</button>
        </div>
    </div>

    <div class="auth-container">
        <a href="/HTML/home.html" class="back-to-home">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="branding">
            Tyvek Lanka
        </div>

        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab">Login</button>
                <button class="auth-tab" id="signupTab">Sign Up</button>
            </div>

            <form id="loginForm" class="auth-form active">
                <h2 class="form-title">Welcome Back!</h2>

                <div class="user-type-selection">
                    <label>Login As:</label>
                    <div class="radio-group">
                        <input type="radio" id="loginCustomer" name="loginUserType" value="customer" checked>
                        <label for="loginCustomer">Customer</label>
                        <input type="radio" id="loginAdmin" name="loginUserType" value="admin">
                        <label for="loginAdmin">Admin</label>
                    </div>
                </div>

                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        Remember Me
                        <input type="checkbox" checked="checked">
                        <span class="checkmark"></span>
                    </label>
                    <a href="/HTML/forgot_password.html" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-button">Login</button>
            </form>

            <form id="signupForm" class="auth-form">
                <h2 class="form-title">Create Your Account</h2>

                <div class="user-type-selection">
                    <label>Sign Up As:</label>
                    <div class="radio-group">
                        <input type="radio" id="signupCustomer" name="signupUserType" value="customer" checked>
                        <label for="signupCustomer">Customer</label>
                        <input type="radio" id="signupAdmin" name="signupUserType" value="admin">
                        <label for="signupAdmin">Admin</label>
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" required>
                </div>
                <div class="input-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" placeholder="••••••••" required>
                </div>

                <label class="checkbox-container terms-checkbox">
                    I agree to the <a href="#" class="terms-link">Terms & Conditions</a>
                    <input type="checkbox" id="termsCheckbox" required>
                    <span class="checkmark"></span>
                </label>

                <button type="submit" class="auth-button">Sign Up</button>
            </form>
        </div>
    </div>

    <script>
        // Custom popup functions
        function showPopup(title, message, isError = false, callback = null) {
            const popup = document.getElementById('customPopup');
            const popupContent = popup.querySelector('.popup-content');
            const popupTitle = document.getElementById('popupTitle');
            const popupMessage = document.getElementById('popupMessage');
            const popupIcon = popup.querySelector('.popup-icon i');
            const popupButton = document.getElementById('popupButton');

            // Set content
            popupTitle.textContent = title;
            popupMessage.textContent = message;

            // Set style based on type
            if (isError) {
                popupContent.classList.add('error');
                popupIcon.className = 'fas fa-exclamation-triangle';
            } else {
                popupContent.classList.remove('error');
                popupIcon.className = 'fas fa-check';
            }

            // Set callback for button
            window.popupCallback = callback;

            // Show popup
            popup.classList.add('show');
        }

        function closePopup() {
            const popup = document.getElementById('customPopup');
            popup.classList.remove('show');
            
            // Execute callback if exists
            if (window.popupCallback && typeof window.popupCallback === 'function') {
                setTimeout(() => {
                    window.popupCallback();
                    window.popupCallback = null;
                }, 300); // Wait for popup to close
            }
        }

        // Close popup when clicking outside
        document.getElementById('customPopup').addEventListener('click', function(e) {
            if (e.target === this) {
                closePopup();
            }
        });

        // Close popup with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePopup();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');

            // Get Firebase instances from the window object (initialized in the module script above)
            const auth = window.firebaseAuth;
            const db = window.firebaseDb;
            const createUserWithEmailAndPassword = window.createUserWithEmailAndPassword;
            const signInWithEmailAndPassword = window.signInWithEmailAndPassword;
            const setDoc = window.setDoc;
            const doc = window.doc;
            const getDoc = window.getDoc;
            const collection = window.collection;

            // Tab switching logic
            loginTab.addEventListener('click', () => {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
            });

            signupTab.addEventListener('click', () => {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupForm.classList.add('active');
                loginForm.classList.remove('active');
            });

            // Signup Form Submission
            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Prevent default form submission

                const fullName = document.getElementById('signupName').value;
                const email = document.getElementById('signupEmail').value;
                const password = document.getElementById('signupPassword').value;
                const confirmPassword = document.getElementById('signupConfirmPassword').value;
                const userType = document.querySelector('input[name="signupUserType"]:checked').value;
                const termsCheckbox = document.getElementById('termsCheckbox');

                // Client-side validation
                if (password !== confirmPassword) {
                    showPopup('Password Mismatch', 'Passwords do not match! Please try again.', true);
                    return;
                }
                if (!termsCheckbox.checked) {
                    showPopup('Terms Required', 'You must agree to the Terms & Conditions.', true);
                    return;
                }
                if (password.length < 6) { // Firebase requires at least 6 characters
                    showPopup('Weak Password', 'Password should be at least 6 characters long.', true);
                    return;
                }

                try {
                    // 1. Create user with email and password using Firebase Authentication
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    console.log("User signed up successfully:", user);

                    // 2. Store additional user data (full name, user type) in Firestore users collection
                    await setDoc(doc(db, "users", user.uid), {
                        fullName: fullName,
                        email: email,
                        userType: userType, // Stores the 'customer' or 'admin' value
                        createdAt: new Date().toISOString() // Store creation timestamp
                    });
                    console.log("User data stored in Firestore for:", user.uid);

                    // 3. NEW: If it's a customer, also add them to the customers collection for the admin dashboard
                    if (userType === 'customer') {
                        await setDoc(doc(collection(db, "customers"), user.uid), {
                            name: fullName,
                            email: email,
                            phone: '', // Set empty for now, can be updated later through profile
                            totalOrders: 0,
                            totalAmount: 0,
                            orders: [],
                            userId: user.uid, // Link back to the auth user
                            createdAt: new Date().toISOString()
                        });
                        console.log("Customer data also stored in customers collection for admin dashboard");
                    }

                    // Show success popup and redirect
                    const redirectUrl = userType === 'admin' ? 
                        '/HTML/Admin_Panel/admin_dashboard.html' : 
                        '/HTML/home.html';
                    
                    showPopup(
                        'Account Created!', 
                        `Welcome to Tyvek Lanka, ${fullName}! Your ${userType} account has been created successfully.`,
                        false,
                        () => window.location.href = redirectUrl
                    );

                } catch (error) {
                    let errorMessage = "An error occurred during signup.";
                    switch (error.code) {
                        case 'auth/email-already-in-use':
                            errorMessage = "The email address is already in use by another account.";
                            break;
                        case 'auth/invalid-email':
                            errorMessage = "The email address is not valid.";
                            break;
                        case 'auth/operation-not-allowed':
                            errorMessage = "Email/password sign-in is not enabled. Please enable it in Firebase Console.";
                            break;
                        case 'auth/weak-password':
                            errorMessage = "The password is too weak. Please use at least 6 characters.";
                            break;
                        default:
                            errorMessage = `Signup Error: ${error.message}`;
                            break;
                    }
                    console.error("Signup error:", error);
                    showPopup('Signup Failed', errorMessage, true);
                }
            });

            // Login Form Submission
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Prevent default form submission

                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                const selectedLoginUserType = document.querySelector('input[name="loginUserType"]:checked').value;

                try {
                    // 1. Sign in user with email and password using Firebase Authentication
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    console.log("User logged in successfully:", user);

                    // 2. Verify user type from Firestore
                    const userDocRef = doc(db, "users", user.uid);
                    const userDocSnap = await getDoc(userDocRef);

                    if (userDocSnap.exists()) {
                        const userData = userDocSnap.data();
                        console.log("User data from Firestore:", userData);

                        if (userData.userType === selectedLoginUserType) {
                            // Show success popup with redirect
                            const redirectUrl = userData.userType === 'admin' ? 
                                '/HTML/Admin_Panel/admin_dashboard.html' : 
                                '/HTML/home.html';
                            
                            showPopup(
                                'Login Successful!', 
                                `Welcome back, ${userData.fullName || user.email}! You are being redirected to your ${userData.userType} dashboard.`,
                                false,
                                () => window.location.href = redirectUrl
                            );
                        } else {
                            // User logged in, but selected wrong user type. Log them out and show error.
                            await auth.signOut(); // Log them out immediately for type mismatch
                            showPopup(
                                'Login Failed', 
                                `You are registered as a ${userData.userType}, but selected ${selectedLoginUserType}. Please choose the correct account type.`,
                                true
                            );
                        }
                    } else {
                        // This case should ideally not happen if every signup creates a Firestore doc
                        await auth.signOut(); // Log them out
                        showPopup(
                            'Profile Not Found', 
                            'User profile not found in database. Please contact support.',
                            true
                        );
                    }

                } catch (error) {
                    let errorMessage = "An error occurred during login.";
                    switch (error.code) {
                        case 'auth/invalid-credential': // Covers invalid email, password, or non-existent user for security
                            errorMessage = "Invalid email or password. Please try again.";
                            break;
                        case 'auth/user-disabled':
                            errorMessage = "Your account has been disabled. Please contact support.";
                            break;
                        case 'auth/too-many-requests':
                            errorMessage = "Too many failed login attempts. Please try again later.";
                            break;
                        default:
                            errorMessage = `Login Error: ${error.message}`;
                            break;
                    }
                    console.error("Login error:", error);
                    showPopup('Login Failed', errorMessage, true);
                }
            });
        });
    </script>
</body>
</html>
