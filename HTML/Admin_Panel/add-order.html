<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Order - Tyvek Lanka</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../../CSS/add-order.css" />
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1><i class="fas fa-plus-circle"></i> Add New Order</h1>
            <p>Create a new order for Tyvek Lanka</p>
        </div>

        <form id="order-form">
            <div class="form-group">
                <label for="order-id">
                    <i class="fas fa-hashtag"></i> Order ID
                </label>
                <input type="text" id="order-id" class="form-control" required placeholder="Enter Order ID">
            </div>

            <div class="form-group">
                <label for="order-date">
                    <i class="fas fa-calendar"></i> Date
                </label>
                <input type="date" id="order-date" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="customer-name">
                    <i class="fas fa-user"></i> Customer Name
                </label>
                <input type="text" id="customer-name" class="form-control" required placeholder="Enter customer name">
            </div>

            <div class="form-group">
                <label for="total-amount">
                    <i class="fas fa-dollar-sign"></i> Total Amount (LKR)
                </label>
                <input type="text" id="total-amount" class="form-control" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="status">
                    <i class="fas fa-info-circle"></i> Order Status
                </label>
                <select id="status" class="form-control" required>
                    <option value="Pending">Pending</option>
                    <option value="Processing">Processing</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    <i class="fas fa-image"></i> Product Image
                </label>
                <div class="file-upload-area" onclick="document.getElementById('file-input').click()">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <div class="upload-text">Click to upload or drag and drop</div>
                    <div class="upload-hint">PNG, JPG, GIF up to 10MB</div>
                </div>
                <input type="file" id="file-input" accept="image/*">
                <div class="preview-container" id="preview-container"></div>
            </div>

            <div class="btn-group">
                <a href="/HTML/Admin_Panel/Order-Management.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Create Order
                </button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Creating order...</p>
        </div>

        <div class="success-message" id="success-message">
            <i class="fas fa-check-circle"></i> Order created successfully!
        </div>

        <div class="error-message" id="error-message">
            <i class="fas fa-exclamation-triangle"></i> <span id="error-text">Something went wrong. Please try again.</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo4MUZvb-eBcl_9YbdkW3QBY64SJrNudQ",
            authDomain: "tyveklanka-a9dd1.firebaseapp.com",
            projectId: "tyveklanka-a9dd1",
            storageBucket: "tyveklanka-a9dd1.firebasestorage.app",
            messagingSenderId: "985040063470",
            appId: "1:985040063470:web:8034aba2c17aae72f45cff"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let selectedFile = null;
        let isAuthenticated = false;

        // Set today's date as default
        document.getElementById('order-date').value = new Date().toISOString().split('T')[0];

        // Sign in anonymously
        signInAnonymously(auth).catch(console.error);

        onAuthStateChanged(auth, user => {
            isAuthenticated = !!user;
        });

        // File upload handling
        const fileInput = document.getElementById('file-input');
        const uploadArea = document.querySelector('.file-upload-area');
        const previewContainer = document.getElementById('preview-container');

        fileInput.addEventListener('change', handleFileSelect);
        uploadArea.addEventListener('dragover', handleDragOver);
        uploadArea.addEventListener('dragleave', handleDragLeave);
        uploadArea.addEventListener('drop', handleDrop);

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                showPreview(file);
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    selectedFile = file;
                    showPreview(file);
                    fileInput.files = files;
                }
            }
        }

        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewContainer.innerHTML = `
                    <img src="${e.target.result}" alt="Preview" class="preview-image">
                    <p style="margin-top: 10px; color: #666; font-size: 0.9rem;">${file.name}</p>
                `;
            };
            reader.readAsDataURL(file);
        }

        // Form submission
        document.getElementById('order-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!isAuthenticated) {
                showError('Authentication required. Please wait and try again.');
                return;
            }

            const orderId = document.getElementById('order-id').value.trim();
            const formData = {
                orderId: orderId,
                date: document.getElementById('order-date').value,
                customer: document.getElementById('customer-name').value.trim(),
                total: parseFloat(document.getElementById('total-amount').value).toFixed(2),
                status: document.getElementById('status').value,
                image: '/Images/sample.jpg', // Default image
                createdAt: new Date()
            };

            // Validation
            if (!formData.customer || !formData.total || !formData.date || !formData.orderId) {
                showError('Please fill in all required fields.');
                return;
            }

            showLoading(true);

            try {
                // Upload image if selected
                if (selectedFile) {
                    const imageRef = ref(storage, `order-images/${orderId}_${selectedFile.name}`);
                    const snapshot = await uploadBytes(imageRef, selectedFile);
                    formData.image = await getDownloadURL(snapshot.ref);
                }

                // Add order to Firestore
                const docRef = await addDoc(collection(db, 'orders'), formData);
                
                showLoading(false);
                showSuccess();
                
                // Reset form after 2 seconds and redirect
                setTimeout(() => {
                    window.location.href = '/HTML/Admin_Panel/Order-Management.html';
                }, 2000);

            } catch (error) {
                console.error('Error creating order:', error);
                showLoading(false);
                showError('Failed to create order. Please try again.');
            }
        });

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('order-form').style.opacity = show ? '0.5' : '1';
            document.getElementById('order-form').style.pointerEvents = show ? 'none' : 'auto';
        }

        function showSuccess() {
            document.getElementById('success-message').style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('error-text').textContent = message;
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }
    </script>
</body>
</html>
