    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/create_prod.css">
</head>
<body>
    <header class="header">

            <div class="logo">

            <a href="#" class="logout-nav-btn">
                <i class="fa-solid fa-right-from-bracket"></i>

            </a>
        </div>
    </header>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <ul>
                <li>
                    <a href="/HTML/Admin_Panel/admin_dashboard.html">
                        <i class="fa-solid fa-house-chimney"></i>

                </li>
                <li>
                    <a href="/HTML/Admin_Panel/add_product.html" class="active">
                        <i class="fa-solid fa-box-open"></i>
                        Products
                    </a>
                </li>
                <li>
                    <a href="/HTML/Admin_Panel/category_management.html">
                        <i class="fa-solid fa-list"></i>
                        Categories
                    </a>
                </li>
                <li>
                    <a href="/HTML/Admin_Panel/Order-Management.html">
                        <i class="fa-solid fa-clipboard-list"></i>
                        Orders
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                        Quotations
                    </a>

                <li>
                    <a href="/HTML/Admin_Panel/customer_dashboard.html">

                </li>

                    <a href="#">

            </ul>
            <!-- User ID and App ID display re-added for debugging -->
            <div class="mt-auto p-4 text-sm text-gray-400">
                <p>User ID: <span id="userIdDisplay">Loading...</span></p>
                <p>App ID: <span id="appIdDisplay">Loading...</span></p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <h2>Add New Product</h2>
                <!-- Removed logout button from here as it's in the main header -->
            </header>

            <section class="form-section">
                <form id="addProductForm" onsubmit="event.preventDefault(); addProduct();">
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" name="productName" placeholder="e.g., Premium Silicone Wristband" required>
                    </div>

                    <div class="form-group">
                        <label for="productDescription">Product Description</label>
                        <textarea id="productDescription" name="productDescription" placeholder="Provide a detailed description of the product, its features, and materials." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="productCategory">Category</label>
                        <select id="productCategory" name="productCategory" required>
                            <option value="">-- Select a Category --</option>
                            <!-- Categories will be loaded here dynamically -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="productColors">Product Colors</label>
                        <select id="productColors" name="productColors" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">-- Select a Color --</option>
                            <option value="red">Red</option>
                            <option value="blue">Blue</option>
                            <option value="green">Green</option>
                            <option value="black">Black</option>
                            <option value="white">White</option>
                            <option value="yellow">Yellow</option>
                            <option value="purple">Purple</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="productQuantity">Product Quantity</label>
                        <input type="number" id="productQuantity" name="productQuantity" min="0" placeholder="e.g., 100" required>
                    </div>

                    <div class="form-group">
                        <label for="productPrice">Price (LKR)</label>
                        <input type="number" id="productPrice" name="productPrice" step="0.01" min="0" placeholder="e.g., 150.00" required>
                    </div>

                    <div class="form-group image-upload-section">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Product Images (Max 4)</label>
                        <input type="file" id="productImages" name="productImages" accept="image/*" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                        <div class="image-preview-container" id="imagePreviewContainer">
                            <!-- Image previews will be inserted here by JavaScript -->
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn-secondary" onclick="window.history.back()">Cancel</button>
                        <button type="submit" class="btn-primary">Save Product</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- Message Box -->
    <div id="messageBox" class="message-box"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";


        // Global Firebase variables
        let app;
        let db;
        let auth;
        let storage; // Added storage
        let userId;
        let productsCollectionRef;
        let categoriesCollectionRef; // New: Reference for categories collection

        // Firebase configuration (provided by the user)
        const firebaseConfig = {
            apiKey: "AIzaSyAo4MUZvb-eBcl_9YbdkW3QBY64SJrNudQ",
            authDomain: "tyveklanka-a9dd1.firebaseapp.com",
            projectId: "tyveklanka-a9dd1",
            storageBucket: "tyveklanka-a9dd1.firebasestorage.app",
            messagingSenderId: "985040063470",
            appId: "1:985040063470:web:8034aba2c17aae72f45cff"
        };

        // Canvas environment variables
        // Ensure appId correctly reflects the project ID or 'default-app-id'
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id'; // Updated to match category backend
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Initialize Firebase and set up authentication
        async function initializeFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                storage = getStorage(app); // Initialize Firebase Storage

                // Display App ID
                document.getElementById('appIdDisplay').textContent = appId;

                let initialAuthCheckDone = false; // Flag to ensure categories are fetched only once after initial auth

                // Listen for auth state changes
                onAuthStateChanged(auth, async (user) => { // Made async to await fetchCategoriesAndPopulateDropdown
                    if (user) {
                        userId = user.uid;
                        document.getElementById('userIdDisplay').textContent = userId;
                        productsCollectionRef = collection(db, `artifacts/${appId}/users/${userId}/products`);
                        // Categories collection now explicitly uses 'default-app-id' as the appId segment
                        categoriesCollectionRef = collection(db, `artifacts/default-app-id/public/data/categories`); // Hardcoded default-app-id
                        console.log("Firebase authenticated. User ID:", userId, "App ID:", appId);
                        console.log("Attempting to fetch categories from path:", categoriesCollectionRef.path);

                        if (!initialAuthCheckDone) { // Only fetch categories on the first successful auth state change
                            await fetchCategoriesAndPopulateDropdown();
                            initialAuthCheckDone = true;
                        }

                    } else {
                        // User is signed out or initial anonymous sign-in failed
                        // We will attempt anonymous sign-in here if not already authenticated
                        // The onAuthStateChanged listener will fire again once signInAnonymously succeeds
                        userId = crypto.randomUUID(); // Fallback for display if not authenticated
                        document.getElementById('userIdDisplay').textContent = userId + " (Anonymous/Not Authenticated)";
                        productsCollectionRef = collection(db, `artifacts/${appId}/users/${userId}/products`);
                        categoriesCollectionRef = collection(db, `artifacts/default-app-id/public/data/categories`); // Still define for consistency

                        console.log("Firebase not authenticated or signed out. User ID (fallback):", userId, "App ID:", appId);
                        // Do NOT call fetchCategoriesAndPopulateDropdown here directly, as it will fail without auth.
                        // The successful auth state change will trigger it.
                    }
                });

                // Initial attempt to sign in anonymously
                // This will trigger the onAuthStateChanged listener when it completes
                await signInAnonymously(auth);
                console.log("Initial anonymous sign-in attempt completed.");

            } catch (error) {
                console.error("Error during Firebase initialization or anonymous sign-in:", error);
                showMessage("Error initializing Firebase. Check console for details.", "error");
            }
        }

        // Function to fetch categories from Firestore and populate the dropdown
        async function fetchCategoriesAndPopulateDropdown() {
            const categorySelect = document.getElementById('productCategory');
            // Clear existing options, keeping the default "Select a Category"
            categorySelect.innerHTML = '<option value="">-- Select a Category --</option>';

            try {
                if (!categoriesCollectionRef) {
                    console.error("Categories collection reference is not initialized. Cannot fetch categories.");
                    showMessage("Error: Categories collection not ready. Try refreshing.", "error");
                    return;
                }
                console.log("Fetching categories from:", categoriesCollectionRef.path);
                const q = query(categoriesCollectionRef);
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    console.warn("No categories found in Firestore at path:", categoriesCollectionRef.path);
                    showMessage("No categories found. Please add some categories first.", "info");
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const categoryData = doc.data();
                    // IMPORTANT: Ensure your category documents have a field named 'name'
                    // If your field is different (e.g., 'categoryName'), change 'categoryData.name' accordingly.
                    if (categoryData && categoryData.name) {
                        const option = document.createElement('option');
                        option.value = categoryData.name;
                        option.textContent = categoryData.name;
                        categorySelect.appendChild(option);
                    } else {
                        console.warn("Category document found without a 'name' field:", doc.id, categoryData);
                    }
                });
                console.log("Categories fetched and dropdown populated successfully.");
            } catch (error) {
                console.error("Error fetching categories:", error);
                showMessage(`Error loading categories: ${error.message}`, "error");
            }
        }


        // Call initialization on window load
        window.onload = initializeFirebase;

        // Function to display messages
        function showMessage(message, type = "info") {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.className = 'message-box show'; // Reset classes and show
            if (type === "error") {
                messageBox.style.backgroundColor = '#e74c3c'; // Red for error
            } else if (type === "success") {
                messageBox.style.backgroundColor = '#2ecc71'; // Green for success
            } else {
                messageBox.style.backgroundColor = '#333'; // Default
            }

            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 3000); // Hide after 3 seconds
        }

        // Function to show/hide loading overlay
        function showLoading(show) {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = show ? 'flex' : 'none';
        }

        // Removed window.selectedImageFiles declaration as it's no longer needed globally
        // The files will be accessed directly from the input element in addProduct.

        // Function to preview images (removed as per user request)
        // window.previewImages = function(event) { ... }

        // Function to add product to Firestore
        window.addProduct = async function() {
            showLoading(true); // Show loading indicator

            const productName = document.getElementById('productName').value.trim();
            const productDescription = document.getElementById('productDescription').value.trim();
            const productCategory = document.getElementById('productCategory').value;
            const productQuantity = parseInt(document.getElementById('productQuantity').value); // Get quantity
            const productPrice = parseFloat(document.getElementById('productPrice').value);

            // Get selected color (single value)
            const productColorsSelect = document.getElementById('productColors');
            const productColors = productColorsSelect.value; // Get the single selected value

            // Get files directly from the input element
            const productImagesInput = document.getElementById('productImages');
            const selectedImageFiles = productImagesInput.files; // Get FileList directly

            // Basic client-side validation
            if (!productName || !productDescription || !productCategory || isNaN(productPrice) || productPrice < 0 || isNaN(productQuantity) || productQuantity < 0) {
                showMessage("Please fill in all required fields correctly.", "error");
                showLoading(false);
                return;
            }

            let imageUrls = [];
            let newProductRef; // Declare newProductRef here

            try {
                // 1. Create a new document reference with an auto-generated ID
                // This ID will be used for both Firestore document and Storage folder
                if (!productsCollectionRef) {
                    throw new Error("Firestore products collection reference not initialized. Authentication might be pending.");
                }
                newProductRef = doc(productsCollectionRef); // Get a document reference with a new ID
                const productId = newProductRef.id;

                // 2. Upload images to Firebase Storage
                // Iterate over the FileList directly
                for (let i = 0; i < selectedImageFiles.length; i++) {
                    const file = selectedImageFiles[i];
                    const storagePath = `products/${productId}/images/${file.name}`;
                    const storageRef = ref(storage, storagePath);
                    console.log(`Attempting to upload file to: gs://${firebaseConfig.storageBucket}/${storagePath}`); // Log the full path
                    const uploadTask = await uploadBytes(storageRef, file);
                    const downloadURL = await getDownloadURL(uploadTask.ref);
                    imageUrls.push(downloadURL);
                    console.log(`Uploaded ${file.name}, URL: ${downloadURL}`);
                }

                // 3. Prepare product data with image URLs
                const productData = {
                    productId: productId, // Store the generated product ID
                    productName: productName,
                    productDescription: productDescription,
                    productCategory: productCategory,
                    productQuantity: productQuantity,
                    productPrice: productPrice,
                    productColor: productColors,
                    imageUrls: imageUrls, // Now contains Storage URLs
                    createdAt: new Date(),
                    userId: userId
                };

                // 4. Set the document in Firestore using the pre-generated ID
                await setDoc(newProductRef, productData);

                showMessage("Product added successfully!", "success");
                document.getElementById('addProductForm').reset(); // Clear form
                document.getElementById('imagePreviewContainer').innerHTML = ''; // Clear previews (though not actively used for preview now)
                // No need to clear selectedImageFiles array as it's local to addProduct now
                productColorsSelect.value = ""; // Reset to the default "Select a Color" option
                console.log("Product added:", productData);

            } catch (e) {
                console.error("Error adding product or uploading images: ", e);
                // More specific error messages for Storage
                if (e.code === 'storage/unauthorized') {
                    showMessage("Storage permission denied. Check your Firebase Storage Security Rules.", "error");
                } else if (e.code === 'storage/canceled') {
                    showMessage("Image upload canceled.", "error");
                } else if (e.code === 'storage/unknown') {
                    showMessage("An unknown error occurred during image upload. Try again.", "error");
                } else {
                    showMessage(`Error adding product: ${e.message}`, "error");
                }
            } finally {
                showLoading(false); // Hide loading indicator
            }
        };
    </script>
    </body>
