<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Tyvek Lanka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            margin: 1rem;
        }

        .back-link {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 2rem;
            display: inline-block;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .title {
            text-align: center;
            color: #333;
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 14px;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .back-to-login {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-to-login a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-to-login a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="admin_login.html" class="back-link">← Back to Login</a>
        
        <h1 class="title">Reset Password</h1>
        <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>
        
        <div id="alertContainer"></div>
        
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email address" required>
            </div>
            
            <button type="submit" class="btn" id="resetBtn">Send Reset Link</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 0.5rem; color: #666;">Sending reset email...</p>
        </div>
        
        <div class="back-to-login">
            <a href="/HTML/Admin_Panel/admin_login.html">Remember your password? Sign in</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getAuth, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, query, collection, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAo4MUZvb-eBcl_9YbdkW3QBY64SJrNudQ", 
            authDomain: "tyveklanka-a9dd1.firebaseapp.com",
            projectId: "tyveklanka-a9dd1",
            storageBucket: "tyveklanka-a9dd1.firebasestorage.app",
            messagingSenderId: "985040063470",
            appId: "1:985040063470:web:8034aba2c17aae72f45cff"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM elements
        const form = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const resetBtn = document.getElementById('resetBtn');
        const loading = document.getElementById('loading');
        const alertContainer = document.getElementById('alertContainer');

        // Show alert function
        function showAlert(message, type) {
            alertContainer.innerHTML = `
                <div class="alert alert-${type}">
                    ${message}
                </div>
            `;
        }

        // Clear alerts
        function clearAlerts() {
            alertContainer.innerHTML = '';
        }

        // Check if email exists in Firestore (customers or admins collection)
        async function checkEmailExists(email) {
            try {
                // Check in customers collection
                const customersQuery = query(collection(db, 'customers'), where('email', '==', email));
                const customerSnapshot = await getDocs(customersQuery);
                
                if (!customerSnapshot.empty) {
                    return { exists: true, type: 'customer' };
                }

                // Check in admins collection
                const adminsQuery = query(collection(db, 'admins'), where('email', '==', email));
                const adminSnapshot = await getDocs(adminsQuery);
                
                if (!adminSnapshot.empty) {
                    return { exists: true, type: 'admin' };
                }

                return { exists: false, type: null };
            } catch (error) {
                console.error('Error checking email:', error);
                return { exists: false, type: null };
            }
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlerts();

            const email = emailInput.value.trim();
            
            if (!email) {
                showAlert('Please enter your email address.', 'error');
                return;
            }

            // Show loading state
            resetBtn.disabled = true;
            resetBtn.textContent = 'Sending...';
            loading.style.display = 'block';

            try {
                // First check if the email exists in our database
                const emailCheck = await checkEmailExists(email);
                
                if (!emailCheck.exists) {
                    showAlert('No account found with this email address. Please check your email or contact support.', 'error');
                    return;
                }

                // Send password reset email
                await sendPasswordResetEmail(auth, email);
                
                showAlert(
                    `Password reset email sent successfully! Please check your inbox and follow the instructions to reset your password.`,
                    'success'
                );
                
                // Clear the form
                emailInput.value = '';
                
            } catch (error) {
                console.error('Password reset error:', error);
                
                let errorMessage = 'Failed to send reset email. ';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage += 'No account found with this email address.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage += 'Please enter a valid email address.';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage += 'Too many reset attempts. Please try again later.';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage += 'Network error. Please check your connection.';
                        break;
                    default:
                        errorMessage += 'Please try again or contact support.';
                }
                
                showAlert(errorMessage, 'error');
            } finally {
                // Reset button state
                resetBtn.disabled = false;
                resetBtn.textContent = 'Send Reset Link';
                loading.style.display = 'none';
            }
        });

        // Clear alerts when user starts typing
        emailInput.addEventListener('input', clearAlerts);
    </script>
</body>
</html>
